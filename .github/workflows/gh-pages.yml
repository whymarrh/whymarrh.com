name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions: {}

concurrency:
  group: "gh-pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read # Required to clone the repo
      pages: write # Required by actions/deploy-pages to deploy to Pages
      id-token: write # Required by actions/deploy-pages to verify the deployment originates from an appropriate source
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Serve the site
        run: python3 -m http.server 8000 --bind 127.0.0.1 --directory public >/dev/null 2>&1 &
      - name: Print the CV to PDF
        run: scripts/generate-pdf
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload only the site directory
          path: "public/"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
